<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=gerenciar.html">
    <title>Redirecionando - SALF</title>
    <script>
        // Determinar o caminho base baseado na URL atual
        var baseUrl = window.location.href.split('/pages/')[0];
        
        // Diferentes tentativas de redirecionamento
        function redirecionar() {
            // Primeira tentativa: url relativa
            window.location.href = "gerenciar.html";
            
            // Segunda tentativa após pequeno delay: caminho completo
            setTimeout(function() {
                // Se ainda estivermos nesta página, tentar caminho absoluto
                window.location.href = baseUrl + "/pages/escola/gerenciar.html";
            }, 100);
            
            // Terceira tentativa após delay maior
            setTimeout(function() {
                // Se ainda aqui, tentar caminho absoluto da raiz
                window.location.href = "/pages/escola/gerenciar.html";
            }, 200);
        }
        
        // Executar o redirecionamento imediatamente
        redirecionar();
        
        // Backup: executar novamente ao carregar (caso o script seja executado antes do DOM carregar)
        window.onload = redirecionar;
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 500px;
        }
        h1 {
            color: #2563eb;
            margin-top: 0;
        }
        p {
            margin-bottom: 1.5rem;
            color: #4b5563;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecionando...</h1>
        <p>Estamos redirecionando você para a nova página de gerenciamento de escolas.</p>
        <a href="gerenciar.html" class="btn">Clique aqui se não for redirecionado automaticamente</a>
    </div>
</body>
</html>
