<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolas - SALF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Template inline para garantir o menu -->
    <script>
        // Template inline para o SALF - versão simplificada
        console.log('📋 Carregando template inline...');

        // Definições básicas
        const userRole = 'admin';
        const userEmail = 'usuario@exemplo.com';

        // Carregar o template de forma síncrona
        function loadInlineTemplate() {
            // Defina valores padrão para usuário
            localStorage.setItem('userRole', userRole);
            localStorage.setItem('userEmail', userEmail);
            localStorage.setItem('isLoggedIn', 'true');
            
            // Estrutura do cabeçalho
            const header = `
                <div class="bg-white border-b px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center">
                        <button id="sidebar-toggle" class="text-gray-600 focus:outline-none lg:hidden mr-2">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h1 class="text-xl font-bold text-blue-800">SALF</h1>
                    </div>
                    <div class="flex items-center">
                        <div class="mr-4 text-sm text-gray-600">
                            <span class="font-semibold">${userEmail}</span>
                            <span class="ml-1 text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">${userRole}</span>
                        </div>
                        <button id="logout-btn" class="text-red-600 hover:text-red-800 focus:outline-none">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </button>
                    </div>
                </div>
            `;
            
            // Detectar a página atual para destacar o item de menu correspondente
            const currentPage = window.location.href;
            
            // Estrutura do sidebar
            const sidebar = `
                <div id="sidebar" class="bg-blue-800 text-white w-64 space-y-1 py-4 fixed inset-y-0 left-0 transform lg:relative lg:translate-x-0 -translate-x-full transition duration-200 ease-in-out z-10">
                    <div class="flex items-center justify-between px-4 mb-4">
                        <div class="flex items-center">
                            <h2 class="text-xl font-bold">SALF</h2>
                        </div>
                        <button id="sidebar-close" class="text-white focus:outline-none lg:hidden">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <nav>
                        <a href="/index.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('index.html') || currentPage.endsWith('/') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-chart-bar w-6"></i>
                            <span>Dashboard</span>
                        </a>
                        <a href="/pages/escola/listar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/escola/') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-school w-6"></i>
                            <span>Escolas</span>
                        </a>
                        <a href="/pages/turma/listar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/turma/') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-users w-6"></i>
                            <span>Turmas</span>
                        </a>
                        <a href="/pages/aluno/listar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/aluno/') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-user-graduate w-6"></i>
                            <span>Alunos</span>
                        </a>
                        <a href="/pages/avaliacao/listar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/avaliacao/listar.html') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-clipboard-check w-6"></i>
                            <span>Avaliações</span>
                        </a>
                        <a href="/pages/usuario/listar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/usuario/') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-user-cog w-6"></i>
                            <span>Usuários</span>
                        </a>
                        <a href="/pages/avaliacao/realizar.html" class="flex items-center px-4 py-3 hover:bg-blue-700 transition ${currentPage.includes('/avaliacao/realizar.html') ? 'bg-blue-700' : ''}">
                            <i class="fas fa-tasks w-6"></i>
                            <span>Realizar Avaliação</span>
                        </a>
                    </nav>
                </div>
            `;
            
            // Adicionar o template ao DOM
            let headerContainer = document.getElementById('header-container');
            if (!headerContainer) {
                console.log('⚠️ Elemento header-container não encontrado, criando fallback');
                headerContainer = document.createElement('div');
                headerContainer.id = 'header-container';
                document.body.prepend(headerContainer);
            }
            
            if (headerContainer) {
                console.log('✅ Adicionando header ao DOM');
                headerContainer.innerHTML = header;
            }
            
            let sidebarContainer = document.getElementById('sidebar-container');
            if (!sidebarContainer) {
                console.log('⚠️ Elemento sidebar-container não encontrado, criando fallback');
                sidebarContainer = document.createElement('div');
                sidebarContainer.id = 'sidebar-container';
                
                // Tentar encontrar o elemento main para inserir antes dele
                const mainContent = document.querySelector('main') || document.body.firstChild;
                document.body.insertBefore(sidebarContainer, mainContent);
            }
            
            if (sidebarContainer) {
                console.log('✅ Adicionando sidebar ao DOM');
                sidebarContainer.innerHTML = sidebar;
            }
            
            // Configurar toggle do sidebar para dispositivos móveis
            setupToggle();
        }

        // Configurar toggle do sidebar para dispositivos móveis
        function setupToggle() {
            console.log('🔄 Configurando toggle do sidebar...');
            
            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebarClose = document.getElementById('sidebar-close');
            const sidebar = document.getElementById('sidebar');
            
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('-translate-x-full');
                });
            }
            
            if (sidebarClose && sidebar) {
                sidebarClose.addEventListener('click', function() {
                    sidebar.classList.add('-translate-x-full');
                });
            }
            
            // Configurar logout
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    window.location.href = '/index.html';
                });
            }
        }

        // Carregar quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 DOMContentLoaded - Iniciando template inline');
            loadInlineTemplate();
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Conteúdo principal -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div id="header-container"></div>
            
            <!-- Conteúdo da página -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-4">
                <div class="container mx-auto">
                    <!-- Título da página e botão de adicionar -->
                    <div class="bg-white rounded-lg shadow-md p-6 mb-6 flex justify-between items-center">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800 mb-1">Escolas</h1>
                            <p class="text-gray-600">Gerencie as escolas do sistema</p>
                        </div>
                        <button id="btn-nova-escola" class="bg-blue-600 text-white rounded-md px-4 py-2 flex items-center hover:bg-blue-700 transition">
                            <i class="fas fa-plus mr-2"></i> Nova Escola
                        </button>
                    </div>
                    
                    <!-- Tabela de escolas -->
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <div class="p-4 border-b">
                            <h2 class="text-lg font-semibold text-gray-800">Lista de Escolas</h2>
                        </div>
                        
                        <!-- Filtro e pesquisa -->
                        <div class="p-4 bg-gray-50 border-b">
                            <div class="flex flex-col sm:flex-row gap-3">
                                <div class="relative flex-1">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i class="fas fa-search"></i>
                                    </span>
                                    <input type="text" placeholder="Pesquisar escolas..." 
                                        class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Tabela -->
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            ID
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Nome da Escola
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Região
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Grupo
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Total de Turmas
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Total de Alunos
                                        </th>
                                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                            Ações
                                        </th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <!-- Dados de exemplo -->
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            1
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="text-sm font-medium text-gray-900">Escola Municipal João da Silva</div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            Norte
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            Municipal
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            8
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            240
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <button class="text-blue-600 hover:text-blue-900 mr-3">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="text-red-600 hover:text-red-900">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            2
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <div class="text-sm font-medium text-gray-900">Escola Estadual Maria José</div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            Sul
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            Estadual
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            12
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                            360
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                            <button class="text-blue-600 hover:text-blue-900 mr-3">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="text-red-600 hover:text-red-900">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Paginação -->
                        <div class="bg-white px-4 py-3 flex items-center justify-between border-t sm:px-6">
                            <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                                <div>
                                    <p class="text-sm text-gray-700">
                                        Mostrando <span class="font-medium">1</span> a <span class="font-medium">2</span> de <span class="font-medium">2</span> resultados
                                    </p>
                                </div>
                                <div>
                                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                                        <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                            <span class="sr-only">Anterior</span>
                                            <i class="fas fa-chevron-left h-5 w-5"></i>
                                        </a>
                                        <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-blue-50 text-sm font-medium text-blue-600 hover:bg-blue-100">
                                            1
                                        </a>
                                        <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                            <span class="sr-only">Próximo</span>
                                            <i class="fas fa-chevron-right h-5 w-5"></i>
                                        </a>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Modal de adicionar escola -->
    <div id="modal-escola" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-auto">
            <div class="px-6 py-4 border-b">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-gray-900">Nova Escola</h3>
                    <button id="fechar-modal" class="text-gray-400 hover:text-gray-500">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <form id="form-escola">
                <div class="p-6">
                    <div class="mb-4">
                        <label for="nome-escola" class="block text-sm font-medium text-gray-700 mb-1">Nome da Escola</label>
                        <input type="text" id="nome-escola" name="nome-escola" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="regiao-escola" class="block text-sm font-medium text-gray-700 mb-1">Região</label>
                        <select id="regiao-escola" name="regiao-escola" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Selecione uma região</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="grupo-escola" class="block text-sm font-medium text-gray-700 mb-1">Grupo</label>
                        <select id="grupo-escola" name="grupo-escola" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Selecione um grupo</option>
                        </select>
                    </div>
                </div>
                <div class="px-6 py-4 bg-gray-50 border-t flex justify-end">
                    <button type="button" id="cancelar-escola" class="bg-white border border-gray-300 text-gray-700 rounded-md px-4 py-2 mr-2 hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-blue-600 text-white rounded-md px-4 py-2 hover:bg-blue-700 transition">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/js/api/api.js"></script>
    <script src="/js/escola.js"></script>
</body>
</html>
